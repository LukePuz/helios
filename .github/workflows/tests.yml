name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: sentence-transformers otherwise pulls the
          # CUDA build (~3 GB of nvidia wheels), which overflows the runner's
          # disk before the tests ever run. The tests don't use a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # polygon-api-client caps certifi<2026, while yfinance>=1.8 needs
          # curl_cffi>=0.17, which needs certifi>=2026.10.19: pip can't
          # resolve both together. The bot's own venv has polygon-api-client
          # 1.16.3 beside certifi 2026.x, so install the rest first and then
          # polygon without its pins, as the box has it.
          grep -v '^polygon-api-client' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install --no-deps 'polygon-api-client==1.16.3'

      - name: Run test suite
        run: python -m pytest tests/ -v
