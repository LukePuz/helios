name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: sentence-transformers otherwise pulls the
          # CUDA build (~3 GB of nvidia wheels), which overflows the runner's
          # disk before the tests ever run. The tests don't use a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v
