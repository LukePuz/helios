# helios-local.service's StandardOutput/StandardError use append: (not
# journald), so it's a plain growing file outside Python's control — the
# app's own log rotation (main.py's RotatingFileHandler, process_manager's
# size-check-on-start for celery/uvicorn logs) doesn't reach it.
#
# Install: sudo cp deploy/logrotate-helios.conf /etc/logrotate.d/helios
/home/YOUR_USER/Desktop/trading_bot/helios-systemd.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
