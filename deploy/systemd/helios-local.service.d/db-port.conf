# Transaction-mode Supabase pooler (port 6543) instead of the session pooler
# on 5432, which caps at 15 clients (EMAXCONNSESSION). load_dotenv runs
# without override, so this wins over .env. Install:
#   sudo mkdir -p /etc/systemd/system/helios-local.service.d
#   sudo install -m 644 deploy/systemd/helios-local.service.d/db-port.conf \
#        /etc/systemd/system/helios-local.service.d/db-port.conf
#   sudo systemctl daemon-reload
# It takes effect at the next start. Rollback: delete the file, daemon-reload.
[Service]
Environment=SUPABASE_PORT=6543
